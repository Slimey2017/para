openapi: 3.1.0
info:
  title: PARA Linux Gateway API
  version: 0.2.0
  description: Read-only Linux system information plus an explicitly enabled local application launcher.
servers:
  - url: http://127.0.0.1:4173/api/v1
paths:
  /health:
    get:
      summary: Report gateway health
      responses:
        '200': { description: Gateway is responding }
  /system:
    get:
      summary: Read operating system and hardware architecture information
      responses:
        '200': { description: Current Linux system information }
  /storage:
    get:
      summary: Read primary storage and mounted drive usage
      responses:
        '200': { description: Storage reported by the host }
  /network:
    get:
      summary: Read current network interface state
      responses:
        '200': { description: Interfaces reported by the host }
  /directories:
    get:
      summary: Read XDG user-directory availability
      responses:
        '200': { description: User directory availability }
  /files:
    get:
      summary: List a supported user directory or mounted-media collection
      parameters:
        - in: query
          name: collection
          required: true
          schema:
            type: string
            enum: [videos, music, documents, downloads, discs, external]
      responses:
        '200': { description: Readable entries or connected media }
        '404': { description: Unknown collection }
  /apps:
    get:
      summary: List routable PARA apps and launchable Linux desktop entries
      responses:
        '200': { description: Applications available in the current runtime }
  /apps/launch:
    post:
      summary: Launch an exact discovered Linux desktop entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        '202': { description: Launch request accepted }
        '404': { description: Application is not available }
