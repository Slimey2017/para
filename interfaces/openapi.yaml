openapi: 3.1.0
info:
  title: PARA Linux Gateway API
  version: 0.5.0
  description: Linux system information, local profile personalization, PARA Files, safe session controls, and explicitly enabled local application, file, volume, and power actions.
servers:
  - url: http://127.0.0.1:4173/api/v1
paths:
  /capabilities:
    get:
      summary: Report only the Linux capabilities available to this PARA session
      responses:
        '200': { description: Current capability map }
  /health:
    get:
      summary: Report gateway health
      responses:
        '200': { description: Gateway is responding }
  /system:
    get:
      summary: Read operating system and hardware architecture information
      responses:
        '200': { description: Current Linux system information }
  /storage:
    get:
      summary: Read primary storage and mounted drive usage
      responses:
        '200': { description: Storage reported by the host }
  /network:
    get:
      summary: Read current network interface state
      responses:
        '200': { description: Interfaces reported by the host }
  /audio:
    get:
      summary: Read PipeWire output and microphone state when available
      responses:
        '200': { description: Current host audio state }
    post:
      summary: Change output volume or mute state through wpctl on a local session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [output, microphone] }
                volume: { type: integer, minimum: 0, maximum: 100 }
                muted: { type: boolean }
      responses:
        '200': { description: Updated host audio state }
        '404': { description: Audio control is unavailable }
  /power:
    post:
      summary: Request one fixed Linux power operation when local power actions are explicitly enabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [suspend, reboot, poweroff] }
      responses:
        '202': { description: Power request accepted }
        '400': { description: Unknown power action }
        '403': { description: System power actions are not enabled }
  /personalization:
    get:
      summary: Read personalization for one PARA profile
      parameters:
        - in: query
          name: profile
          required: true
          schema: { type: string }
      responses:
        '200': { description: Saved profile preferences, if present }
    post:
      summary: Persist validated personalization for one local PARA profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile, preferences]
              properties:
                profile: { type: string, minLength: 1, maxLength: 80 }
                preferences: { type: object }
      responses:
        '200': { description: Preferences saved atomically }
        '403': { description: Profile writes are unavailable in this runtime }
  /backgrounds/custom:
    get:
      summary: Read the custom image for one authenticated local profile context
      parameters:
        - in: query
          name: profile
          required: true
          schema: { type: string }
      responses:
        '200': { description: PNG, JPEG, or WebP image }
        '404': { description: No custom image exists }
    post:
      summary: Store a validated PNG, JPEG, or WebP image for one local profile
      parameters:
        - in: query
          name: profile
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '201': { description: Image stored atomically }
        '415': { description: Image type or bytes are unsupported }
  /directories:
    get:
      summary: Read XDG user-directory availability
      responses:
        '200': { description: User directory availability }
  /files/browse:
    get:
      summary: Browse an actual local directory, Recent, or Trash on a local PARA session
      parameters:
        - in: query
          name: path
          schema: { type: string, default: home }
      responses:
        '200': { description: Current location, real entries, real places, and action capabilities }
        '403': { description: Files are unavailable outside a local session }
        '404': { description: The requested location does not exist }
  /files/search:
    get:
      summary: Search names below one actual readable local directory
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: Up to 200 actual matching files and directories }
        '400': { description: Search input or location is invalid }
  /files/action:
    post:
      summary: Perform an explicitly enabled local file action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [open, create-folder, create-file, rename, copy, move, trash, restore, delete] }
                paths: { type: array, maxItems: 100, items: { type: string } }
                destination: { type: string }
                name: { type: string }
                trash_uri: { type: string }
      responses:
        '200': { description: Action completed }
        '201': { description: File or folder created }
        '202': { description: Open request accepted }
        '403': { description: File actions were not explicitly enabled }
        '409': { description: Destination name already exists }
  /volumes/action:
    post:
      summary: Mount, unmount, or eject an actual removable block device through udisks2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, device]
              properties:
                action: { type: string, enum: [mount, unmount, eject] }
                device: { type: string }
      responses:
        '200': { description: Device action completed }
        '400': { description: Device or action is invalid }
        '403': { description: Volume actions were not explicitly enabled }
  /apps:
    get:
      summary: List routable PARA apps and launchable Linux desktop entries
      responses:
        '200': { description: Applications available in the current runtime }
  /apps/launch:
    post:
      summary: Launch an exact discovered Linux desktop entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        '202': { description: Launch request accepted }
        '404': { description: Application is not available }
